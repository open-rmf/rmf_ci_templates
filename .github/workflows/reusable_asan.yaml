# DEPRECATED: Use reusable_build.yaml with `mixin: asan` instead.
# Kept for backwards compatibility with existing callers and release branches.
name: asan (deprecated)
on:
  workflow_call:
    inputs:
      packages:
        description: package names to build
        required: true
        type: string
      dist-matrix:
        description: dist matrix to build
        required: false
        type: string
        default: |
          [{"ros_distribution": "humble"},
          {"ros_distribution": "jazzy"},
          {"ros_distribution": "lyrical"},
          {"ros_distribution": "rolling"}]
jobs:
  asan:
    name: asan (deprecated)
    uses: ./.github/workflows/reusable_build.yaml
    with:
      dist-matrix: ${{inputs.dist-matrix}}
      packages: ${{inputs.packages}}
      mixin: asan
